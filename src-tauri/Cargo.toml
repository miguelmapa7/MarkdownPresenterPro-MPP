[package]
name = "markdown-presenter-pro"
version = "0.1.0"
description = "Desktop app for Markdown presentations"
authors = ["you"]
edition = "2021"

[lib]
name = "markdown_presenter_pro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
